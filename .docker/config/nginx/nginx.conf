worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    disable_symlinks off;
    # Prevent nginx HTTP Server Detection
    server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Real-IP;

    #gzip  on;

    upstream php-handler {
        server php:9000;
    }

    # Timeout
    client_body_timeout 300;
    client_header_timeout 300;
    keepalive_timeout 65;
    send_timeout 300;

    server {
        listen 80;
        server_name localhost;

        # Remove X-Powered-By, which is an information leak
        fastcgi_hide_header X-Powered-By;

        root /var/www/html/src;

        index index.php index.html /index.php$request_uri;

        location ~ ^/(logs|tmp_attach)/ {
            deny all;
        }

        location ~* \.(jpg|jpeg|png|ico|css|js)$ {
            try_files $uri =404;
        }

        location ~ \.php(?:$|/) {
            try_files $fastcgi_script_name =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            fastcgi_read_timeout 6000s;
            fastcgi_send_timeout 6000s;
            fastcgi_connect_timeout 6000s;
        }

        location ~ ^/(api|external|kiosk|session|v2|setup)/ {
            rewrite ^/(api|external|kiosk|session|v2|setup)(?:/.*)?$ /$1/index.php$2 last;
        }

        location / {
            try_files $uri $uri/ /index.php$request_uri;
        }
    }

}